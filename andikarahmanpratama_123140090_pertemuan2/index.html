<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <div class="header-content">
          <h1 class="logo">Dashboard</h1>
          <div class="header-stats">
            <div class="stat-card">
              <span class="stat-label">Total Tugas</span>
              <span class="stat-value" id="totalTasks">0</span>
            </div>
            <div class="stat-card">
              <span class="stat-label">Selesai</span>
              <span class="stat-value" id="completedTasks">0</span>
            </div>
            <div class="stat-card">
              <span class="stat-label">Pending</span>
              <span class="stat-value" id="pendingTasks">0</span>
            </div>
          </div>
        </div>
      </header>

      <main class="main-content">
        <section class="dashboard-section">
          <div class="section-header">
            <h2>Daftar Tugas Saya</h2>
            <div class="controls">
              <input
                type="text"
                id="filterInput"
                class="filter-input"
                placeholder="Cari tugas..."
              />
              <button id="addBtn" class="btn btn-primary">
                + Tambah Tugas
              </button>
            </div>
          </div>

          <div class="filter-tabs">
            <button class="tab-btn active" data-filter="all">Semua</button>
            <button class="tab-btn" data-filter="pending">Pending</button>
            <button class="tab-btn" data-filter="completed">Selesai</button>
          </div>

          <div class="tasks-container" id="tasksContainer"></div>
        </section>
      </main>
    </div>

    <div id="taskModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="modalTitle">Tambah Tugas Baru</h2>
          <button class="close-btn" id="closeModal">&times;</button>
        </div>
        <form id="taskForm">
          <div class="form-group">
            <label for="taskTitle">Judul Tugas</label>
            <input
              type="text"
              id="taskTitle"
              required
              placeholder="Masukkan judul tugas..."
            />
          </div>
          <div class="form-group">
            <label for="taskDesc">Deskripsi</label>
            <textarea
              id="taskDesc"
              placeholder="Masukkan deskripsi tugas..."
              rows="4"
            ></textarea>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="taskPriority">Prioritas</label>
              <select id="taskPriority">
                <option value="Rendah">Rendah</option>
                <option value="Sedang" selected>Sedang</option>
                <option value="Tinggi">Tinggi</option>
              </select>
            </div>
            <div class="form-group">
              <label for="taskDueDate">Tanggal Target</label>
              <input type="date" id="taskDueDate" />
            </div>
          </div>
          <div class="form-actions">
            <button type="button" class="btn btn-secondary" id="cancelBtn">
              Batal
            </button>
            <button type="submit" class="btn btn-primary">Simpan Tugas</button>
          </div>
        </form>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
