<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aplikasi Manajemen Tugas Mahasiswa</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Manajemen Tugas Mahasiswa</h1>
        <p>Kelola aktivitas akademik Anda dengan mudah</p>
      </header>

      <main>
        <section class="form-section">
          <h2>Tambah Tugas Baru</h2>
          <form id="taskForm">
            <div class="form-group">
              <label for="taskName">Nama Tugas *</label>
              <input
                type="text"
                id="taskName"
                placeholder="Contoh: Buat laporan penelitian"
                maxlength="100"
                required
              />
              <small>Maksimal 100 karakter</small>
            </div>

            <div class="form-group">
              <label for="subject">Mata Kuliah *</label>
              <input
                type="text"
                id="subject"
                placeholder="Contoh: Pemrograman Web"
                maxlength="50"
                required
              />
              <small>Maksimal 50 karakter</small>
            </div>

            <div class="form-group">
              <label for="deadline">Deadline *</label>
              <input type="date" id="deadline" required />
            </div>

            <div class="form-group">
              <label for="notes">Catatan</label>
              <textarea
                id="notes"
                placeholder="Tambahkan catatan atau deskripsi tugas (opsional)"
                maxlength="500"
                rows="4"
              ></textarea>
              <small id="charCount">0/500 karakter</small>
            </div>

            <button type="submit" class="btn btn-primary">Tambah Tugas</button>
          </form>
          <div id="formError" class="error-message"></div>
        </section>

        <section class="stats-section">
          <div class="stat-card">
            <h3>Total Tugas</h3>
            <p id="totalTasks">0</p>
          </div>
          <div class="stat-card">
            <h3>Belum Selesai</h3>
            <p id="incompleteTasks">0</p>
          </div>
          <div class="stat-card">
            <h3>Selesai</h3>
            <p id="completedTasks">0</p>
          </div>
        </section>

        <section class="filter-section">
          <div class="filter-group">
            <label for="filterStatus">Filter Status:</label>
            <select id="filterStatus">
              <option value="all">Semua</option>
              <option value="incomplete">Belum Selesai</option>
              <option value="completed">Selesai</option>
            </select>
          </div>

          <div class="filter-group">
            <label for="filterSubject">Filter Mata Kuliah:</label>
            <select id="filterSubject">
              <option value="all">Semua Mata Kuliah</option>
            </select>
          </div>

          <button id="clearFilters" class="btn btn-secondary">
            Reset Filter
          </button>
        </section>

        <section class="tasks-section">
          <h2>Daftar Tugas</h2>
          <div id="tasksList" class="tasks-list">
            <p class="empty-message">Belum ada tugas. Tambahkan tugas baru!</p>
          </div>
        </section>
      </main>

      <footer>
        <p>&copy; 2025 Aplikasi Manajemen Tugas Mahasiswa.</p>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
